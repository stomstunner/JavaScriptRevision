<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Function</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class ='language'>
        <li>
            javascript
        </li>
    </ul>
</body>
<script>
    // here we make a function that acpet the text and show it on the page 
    // seclect the ul 
    const myul = document.querySelector(".language")
    // console.log(myul);
    function addLanguage(language){
        // so we are creating a elemet 
        const li = document.createElement('li')
        // then we are adding the paramenter to the inner html 
        li.innerHTML = `${language}`
        // now we show the text to the page decument
        document.querySelector('.language').appendChild(li)
    }

    // now we call the function 
    addLanguage("python")
    addLanguage("ujjwal")
    addLanguage("ujjwal")

    // lets do the more optimize way to do that so it can reduce the tree traversal 
    function addLanguageOptimize(langName){
        // first we write the basic function structure
        // then we make a  variable that store the way to create a elemet

        // const li = document.createElement('li')

        // // then we make a variable that create a textnode with the paramenter from th user 

        // const addText = document.createTextNode(langName)

        // // then we just appen the text to the li variable that has the code to create element and in the li we append the text node as a a child

        // li.appendChild(addText)

        // or
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)

    }
    addLanguageOptimize("hello")
    addLanguageOptimize("hello")
    

    //  now we want ki hama apne text ko edit bhi kar paye optimize trike se  
    // const secondLang  = document.querySelector('li')
    // console.log(secondLang);
    // secondLang.innerHTML = "helloujjwal"
    // //  but this is not a optimize way to to it 

    const secondLang = document.querySelector("li:nth-child(2)")
    console.log(secondLang);
    
    const newLi = document.createElement('li')
    newLi.textContent = "stomstunner"
    // jo hamra pahle se bana hua eleemt hai uske text ko ham nayewla se replace karnege
    secondLang.replaceWith(newLi)
    

    // lets do the another example of the edit 
    const firstchild = document.querySelector('li:first-Child')
    console.log(firstchild);
    const newLi1 = document.createElement("li")
    newLi1.textContent = "Typescript"
    firstchild.replaceWith(newLi1)

    // now we can edit by writing the whole tml tag 
    const firstChild1 = document.querySelector('li')
    firstChild1.outerHTML = "<li>TYPESCRIPT</li>"
    

    //  now we can remove the data from the page also 
    const firstChildRemove = document.querySelector('li:first-child')
    firstChildRemove.remove()
    
</script>
</html>
